name: Publish Windows beta

on:
  push:
    branches: [main]
    paths:
      - '.release-beta'

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build Windows beta
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GardenOfJihan\GardenOfJihan.exe")) { throw "Executable missing" }
          if (-not (Test-Path "dist\GardenOfJihan\_internal\bin\ffmpeg.exe") -and -not (Test-Path "dist\GardenOfJihan\bin\ffmpeg.exe")) { throw "Bundled ffmpeg missing" }
          if (-not (Test-Path "dist\GardenOfJihan\_internal\bin\ffprobe.exe") -and -not (Test-Path "dist\GardenOfJihan\bin\ffprobe.exe")) { throw "Bundled ffprobe missing" }
          if (-not (Test-Path "dist\GardenOfJihan-Windows-x64.zip")) { throw "Release ZIP missing" }

      - name: Smoke-test packaged executable and UI
        shell: pwsh
        run: |
          $env:GOJ_PORT = "8765"
          $env:GOJ_NO_BROWSER = "1"
          $process = Start-Process -FilePath "dist\GardenOfJihan\GardenOfJihan.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "GardenOfJihan.exe exited before becoming healthy" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 3
                if ($health.ok -eq $true -and $health.local -eq $true) {
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) { throw "Packaged application did not become healthy in time" }
            $homeResponse = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 5
            if ($homeResponse.Content -notmatch "Garden of Jihan") { throw "Packaged UI did not load" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\GardenOfJihan-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  GardenOfJihan-Windows-x64.zip" | Set-Content "dist\GardenOfJihan-Windows-x64.sha256" -Encoding ascii
          Get-Content "dist\GardenOfJihan-Windows-x64.sha256"

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-beta.1"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release $tag already exists. Bump the beta version before publishing again."
          }
          gh release create $tag `
            "dist\GardenOfJihan-Windows-x64.zip" `
            "dist\GardenOfJihan-Windows-x64.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Garden of Jihan v0.1.0 Beta 1" `
            --prerelease `
            --notes "First public Windows beta of Garden of Jihan. Download the ZIP, extract it, and open GardenOfJihan.exe. No Python, FFmpeg, subscription, credits, or paid AI API is required. This release passed CI, Ruff, Bandit, dependency audit, CodeQL, packaged-file verification, and a clean-Windows executable/UI smoke test. Advanced Qur'an/Qira'at recognition, Somali corpus validation, automatic speaker tracking, styled captions, and direct social publishing are still under active development."
