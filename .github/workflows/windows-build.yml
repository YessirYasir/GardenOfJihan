name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/smoke-captions.ps1'
      - 'scripts/smoke-auto-framing.ps1'
      - 'scripts/smoke-windows-package.ps1'
      - 'scripts/assert-signed-release.ps1'
      - 'scripts/version-info.txt'
      - 'THIRD-PARTY-NOTICES.md'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GardenOfJihan\GardenOfJihan.exe")) { throw "Executable missing" }
          if (-not (Test-Path "dist\GardenOfJihan\_internal\bin\ffmpeg.exe") -and -not (Test-Path "dist\GardenOfJihan\bin\ffmpeg.exe")) { throw "Bundled ffmpeg missing" }
          if (-not (Test-Path "dist\GardenOfJihan\_internal\bin\ffprobe.exe") -and -not (Test-Path "dist\GardenOfJihan\bin\ffprobe.exe")) { throw "Bundled ffprobe missing" }
          if (-not (Test-Path "dist\GardenOfJihan-Windows-x64.zip")) { throw "Release ZIP missing" }

      - name: Smoke-test bundled styled captions
        shell: pwsh
        run: |
          $ffmpeg = if (Test-Path "dist\GardenOfJihan\_internal\bin\ffmpeg.exe") { "dist\GardenOfJihan\_internal\bin\ffmpeg.exe" } else { "dist\GardenOfJihan\bin\ffmpeg.exe" }
          .\scripts\smoke-captions.ps1 -FfmpegPath $ffmpeg

      - name: Smoke-test dynamic vertical framing
        shell: pwsh
        run: |
          $ffmpeg = if (Test-Path "dist\GardenOfJihan\_internal\bin\ffmpeg.exe") { "dist\GardenOfJihan\_internal\bin\ffmpeg.exe" } else { "dist\GardenOfJihan\bin\ffmpeg.exe" }
          .\scripts\smoke-auto-framing.ps1 -FfmpegPath $ffmpeg

      - name: Smoke-test packaged executable and UI
        shell: pwsh
        run: .\scripts\smoke-windows-package.ps1 -PackageRoot "dist\GardenOfJihan"

      - name: Scan packaged app with Microsoft Defender
        shell: pwsh
        run: |
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          $mpCmdRun = $null
          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if ($latest) { $mpCmdRun = Join-Path $latest.FullName "MpCmdRun.exe" }
          }
          if (-not $mpCmdRun -or -not (Test-Path $mpCmdRun)) {
            $fallback = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (Test-Path $fallback) { $mpCmdRun = $fallback }
          }
          if (-not $mpCmdRun -or -not (Test-Path $mpCmdRun)) { throw "Microsoft Defender scanner is unavailable" }
          $target = (Resolve-Path "dist\GardenOfJihan").Path
          & $mpCmdRun -Scan -ScanType 3 -File $target
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan did not return a clean result (exit code $LASTEXITCODE)" }

      - name: Require trusted signature in the public release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .\scripts\assert-signed-release.ps1 -PackageRoot "dist\GardenOfJihan" -ArchivePath "dist\GardenOfJihan-Windows-x64.zip"

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\GardenOfJihan-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  GardenOfJihan-Windows-x64.zip" | Set-Content "dist\GardenOfJihan-Windows-x64.sha256" -Encoding ascii

      - name: Attest signed release build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/GardenOfJihan-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: GardenOfJihan-Windows-x64
          path: |
            dist/GardenOfJihan-Windows-x64.zip
            dist/GardenOfJihan-Windows-x64.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GardenOfJihan-Windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/GardenOfJihan-Windows-x64.zip" \
            "release/GardenOfJihan-Windows-x64.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Garden of Jihan $GITHUB_REF_NAME" \
            --generate-notes
