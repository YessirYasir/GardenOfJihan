name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test and security dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest --cov=garden_jihan --cov-report=term-missing
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Ruff
        run: python -m ruff check .
      - name: Bandit medium/high findings
        run: python -m bandit -q -r src -ll
      - name: Dependency audit
        run: python -m pip_audit
